<html>
    <title>Form</title>
<style>
   h6{
    color: black;
    font-size: larger;
   } 
   button{
    border-radius: 40px;
    font-size: medium;
    background-color: green;
   }
   input{
    padding: 5px;
   }
   form{
    background-color: antiquewhite;
   }
</style>

    <body>
        <form id="travel">
        <h1><u>Travel Enquiry</u></h1>
        <h6>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter email"><br><br>
        <label for="dest">Destination:</label>
        <input type="text" id="dest" placeholder="Enter destination"><br><br>
        <label for="date">Date:</label>
        <input type="date" id="date"><br><br>
        <label for="num">Number of travellers:</label>
        <input type="number" id="num" placeholder="Enter no of travellers"><br><br>
        <label for="budget">Budget:</label>
        <input type="text" id="budget" placeholder="Enter Budget"><br><br>
        <label for="pref">Travel preferences:</label>
        <input type="text" id="pref" placeholder="Travel preferences"><br>
        </h6>
        <Button type="button" onclick="validate()" >Submit</Button>
        </form>
    <script>
        function validate(){
            let name=document.getElementById("name").value;
            let email=document.getElementById("email").value;
            let dest=document.getElementById("dest").value;
            let date=document.getElementById("date").value;
            let num=document.getElementById("num").value;
            let budget=document.getElementById("budget").value;
            let pref=document.getElementById("pref").value;      
    if (name === "") {
        alert("Name is required.");
        return false;
    }
    if (email=== "") {
        alert("Email is required.");
        return false;
    }
    if (!email.includes("@") || !email.includes(".")) {
        alert("Enter a valid email.");
        return false;
    }
    if (dest=== "") {
        alert("Destination is required.");
        return false;
    }
    if (date === "") {
        alert("Please select a date.");
        return false;
    }
    if (num === "" || Number(num) <= 0) {
        alert("Enter a valid number of travellers.");
        return false;
    }
    if (budget=== "") {
        alert("Budget is required.");
        return false;
    }
    if (pref=== "") {
        alert("Travel preferences are required.");
        return false;
    }
    alert("Travel enquiry submitted successfully!");
    location.reload();
}

    </script>
    </body>
</html>
